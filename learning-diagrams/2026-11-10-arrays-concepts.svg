<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120">
<rect width="1400" height="1120" fill="#f3f6fb"/>
<text x="70" y="75" font-family="Arial,sans-serif" font-size="42" font-weight="700" fill="#132642">Arrays: create, change, search</text>
<text x="70" y="110" font-family="Arial,sans-serif" font-size="21" fill="#52647d">10 November 2026  •  JavaScript and TypeScript</text>
<rect x="70" y="145" width="1260" height="115" rx="18" fill="#183d69"/>
<text x="100" y="184" font-family="Arial,sans-serif" font-size="24" font-weight="700" fill="#fff">An array is an ordered collection with zero-based indexes.</text>
<text x="100" y="219" font-family="Arial,sans-serif" font-size="20" fill="#dceaff">Its length can grow or shrink. TypeScript types describe which values are allowed.</text>
<g font-family="Arial,sans-serif" fill="#172b46">
<rect x="70" y="290" width="610" height="235" rx="18" fill="#fff" stroke="#d8e1ee"/>
<text x="98" y="330" font-size="25" font-weight="700" fill="#176783">1  Create and access</text>
<text x="98" y="365" font-size="19">any[] can contain values of different types.</text>
<text x="98" y="397" font-size="19">string[] restricts values to strings in TypeScript.</text>
<text x="98" y="429" font-size="19">(number | string)[] accepts either type.</text>
<text x="98" y="465" font-size="19">names.length → 5     names.at(4) → "true"</text>
<text x="98" y="497" font-size="19">names[10] → undefined when no value exists there.</text>
<rect x="720" y="290" width="610" height="235" rx="18" fill="#fff" stroke="#d8e1ee"/>
<text x="748" y="330" font-size="25" font-weight="700" fill="#a1512f">2  Grow and fill</text>
<text x="748" y="365" font-size="19">new Array(10) creates 10 empty slots.</text>
<text x="748" y="397" font-size="19">fill(400) writes 400 into every slot.</text>
<text x="748" y="429" font-size="19">Assigning names[900] extends length to 901;</text>
<text x="748" y="459" font-size="19">unassigned positions between become empty slots.</text>
<text x="748" y="497" font-size="19">concat(...) returns a new array.</text>
<rect x="70" y="555" width="610" height="245" rx="18" fill="#fff" stroke="#d8e1ee"/>
<text x="98" y="595" font-size="25" font-weight="700" fill="#7452a0">3  Change the original array</text>
<text x="98" y="634" font-size="19">START</text><text x="330" y="634" font-size="19">END</text>
<text x="98" y="670" font-size="19">unshift(...)  →  add</text><text x="330" y="670" font-size="19">push(...)  →  add</text>
<text x="98" y="704" font-size="19">shift()  →  remove</text><text x="330" y="704" font-size="19">pop()  →  remove</text>
<text x="98" y="746" font-size="19">shift() / pop() return undefined on an empty array.</text>
<text x="98" y="778" font-size="19">reverse() changes the array in place.</text>
<rect x="720" y="555" width="610" height="245" rx="18" fill="#fff" stroke="#d8e1ee"/>
<text x="748" y="595" font-size="25" font-weight="700" fill="#147c68">4  Find positions</text>
<text x="748" y="632" font-size="19">a = [900, 200, 100, 900, 500, 200, -500]</text>
<text x="748" y="668" font-size="19">a.indexOf(900) → 0    •    lastIndexOf(900) → 3</text>
<text x="748" y="704" font-size="19">a.indexOf(1000) → -1  (value not found)</text>
<text x="748" y="741" font-size="19">Second occurrence: search again after the first:</text>
<text x="748" y="774" font-family="Menlo,monospace" font-size="17">a.indexOf(900, a.indexOf(900) + 1) → 3</text>
<rect x="70" y="830" width="1260" height="205" rx="18" fill="#fff" stroke="#d8e1ee"/>
<text x="98" y="870" font-size="25" font-weight="700" fill="#a0641a">5  Split and sort</text>
<text x="98" y="909" font-size="19">"Apple a day".split(" ") → ["Apple", "a", "day"]    •    split("a") separates at each lowercase a.</text>
<text x="98" y="947" font-size="19">sort() changes the array in place. By default, values are compared as strings in UTF-16 order.</text>
<text x="98" y="985" font-size="19">For numeric ascending order, use a comparator: numbers.sort((a, b) =&gt; a - b).</text>
</g>
<text x="70" y="1080" font-family="Arial,sans-serif" font-size="16" fill="#65758b">Source: november10th2026/ArraysConcepts.ts  •  Examples shortened for readability</text>
</svg>
